[package]
name = "norman"
version = "0.1.1"
description = "Локальная первичная проверка нормативных актов"
authors = ["Норман"]
edition = "2021"
build = "build.rs"

[lib]
name = "norman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "norman"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ego-tree = "0.11"
encoding_rs = "0.8"
office_oxide = "0.1.16"
pdf-extract = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "blocking", "json"] }
roxmltree = "0.21"
scraper = { version = "0.29", features = ["atomic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
