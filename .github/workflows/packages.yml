name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: norman-macos-dmg
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles dmg
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: nsis
            artifact: norman-windows-nsis
            rust-targets: ''
            build-args: --bundles nsis
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: norman-linux-appimage
            rust-targets: ''
            build-args: --bundles appimage
            path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: matrix.rust-targets != ''
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - run: npm ci

      - name: Verify rule catalog regression
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml risk_rule_catalog_compiles_and_matches_cyrillic_domains

      - name: Build ${{ matrix.bundle }} package
        run: npm run tauri build -- ${{ matrix.build-args }}

      - name: Normalize package filename
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE_KIND: ${{ matrix.bundle }}
        run: node scripts/rename-release-asset.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                _*) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
              esac
            done
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "Норман $GITHUB_REF_NAME" \
              --generate-notes
          fi
