name: Packages

on:
  pull_request:
    paths:
      - ".github/workflows/packages.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - "data/**"
      - "public/**"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: norman-macos-dmg
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles dmg
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: nsis
            artifact: norman-windows-nsis
            rust-targets: ''
            build-args: --bundles nsis
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: norman-linux-appimage
            rust-targets: ''
            build-args: --bundles appimage --verbose
            path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set app version from GitHub tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/set-release-version.mjs "$RELEASE_TAG"
          node scripts/check-release-version.mjs "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: matrix.rust-targets != ''
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - run: npm ci

      - name: Test Windows Rust code
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Windows release checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-release-evidence.ps1

      - name: Verify rule catalog regression
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml risk_rule_catalog_compiles_and_matches_cyrillic_domains

      - name: Build ${{ matrix.bundle }} package
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          NO_STRIP: ${{ matrix.bundle == 'appimage' && 'true' || '' }}
        run: npm run tauri build -- ${{ matrix.build-args }}

      - name: Normalize package filename
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BUNDLE_KIND: ${{ matrix.bundle }}
        run: node scripts/rename-release-asset.mjs

      - name: Scan and record Windows release evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          ./scripts/windows-release-evidence.ps1 -InstallerPath $installer -AppPath 'src-tauri/target/release/norman.exe' -EvidencePath 'windows-release-evidence.json'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && always()
        with:
          name: norman-windows-security-evidence
          path: windows-release-evidence.json
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.dmg *.exe *.AppImage > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.dmg release-assets/*.exe release-assets/*.AppImage release-assets/SHA256SUMS.txt --clobber
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                _*) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
              esac
            done
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.dmg release-assets/*.exe release-assets/*.AppImage release-assets/SHA256SUMS.txt \
              --verify-tag \
              --title "Норман $GITHUB_REF_NAME" \
              --generate-notes
          fi
